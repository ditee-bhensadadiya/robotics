esp32_bridge:
  ros__parameters:
    serial_port: /dev/ttyUSB0     # confirm with: ls -l /dev/ttyUSB* /dev/ttyACM* after plugging in the ESP32
    baud_rate: 115200
    wheel_diameter_m: 0.1524      # 6 inch wheel, confirmed
    wheel_base_m: 0.30            # TODO: measure the actual distance between left/right wheel centers (m)
    ticks_per_rev: 60             # pole_pairs(10) * 6, matches the firmware
    max_wheel_speed_mps: 0.5      # TODO: tune to your motors' real top speed
    odom_frame_id: odom
    base_frame_id: base_link
    publish_tf: false             # robot_localization (ekf_node) publishes odom->base_link instead
