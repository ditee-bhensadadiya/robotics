ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # Wheel odometry from esp32_bridge: fuse position (x, y, yaw) and velocity (vx, vyaw).
    odom0: odom
    odom0_config: [true,  true,  false,
                   false, false, true,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    # MPU6050 raw IMU: no onboard orientation filter, so only fuse yaw rate
    # (angular_velocity.z) as a correction to wheel-odometry yaw. Do not fuse
    # imu orientation/acceleration fields here - they're unfiltered/uncalibrated.
    imu0: imu/data_raw
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true
    imu0_queue_size: 10
